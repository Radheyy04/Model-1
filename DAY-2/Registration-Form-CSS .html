<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elegant Student Registration Form</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #dbeafe, #f8fafc);
        }

        header {
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            font-size: 38px;
        }

        header p {
            margin-top: 8px;
            font-size: 18px;
        }

        nav {
            background-color: #1e3a8a;
            text-align: center;
            padding: 14px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 18px;
            font-size: 17px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd700;
        }

        article {
            width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
        }

        article h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #1e293b;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            outline: none;
        }

        .gender {
            width: auto;
            margin-right: 8px;
        }

        .btn {
            width: 48%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: white;
        }

        .submit-btn {
            background-color: #16a34a;
        }

        .reset-btn {
            background-color: #dc2626;
            float: right;
        }

        footer {
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
        

    </style>

</head>

<body>

    <!-- Header -->
    <header>
        <h1>Silver Oak University</h1>
        <h3>Student Registration Portal</h3>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Sign Up</a>
        <a href="#">Sign In</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Article -->
    <article>

        <!-- Inline CSS -->
        <h2 style="letter-spacing: 1px;">
            Student Registration Form
        </h2>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Enrollment Number</label>
            <input type="text" placeholder="Enter enrollment number" required>

            <label>Branch</label>
            <select>
                <option>Select Branch</option>
                <option>Computer Engineering</option>
                <option>Information Technology</option>
                <option>Mechanical Engineering</option>
                <option>Electrical Engineering</option>
            </select>

            <label>Division</label>
            <input type="text" placeholder="Enter division" required>

            <label>Gender</label><br><br>

            <input type="radio" name="gender" class="gender"> Male

            <input type="radio" name="gender" class="gender"
                style="margin-left:25px;"> Female

            <br><br><br>

            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter mobile number" required>

            <label>Email Address</label>
            <input type="email" placeholder="Enter email address" required>

            <label>Password</label>
            <input type="password" placeholder="Enter password" required>

            <label>Upload Photo</label>
            <input type="file">

            <label>Remarks</label>
            <textarea rows="4" placeholder="Write your remarks here"></textarea>

            <!-- Inline CSS -->
            <input type="submit" value="Submit"
                class="btn submit-btn"
                style="font-weight:bold;">

            <input type="reset" value="Clear"
                class="btn reset-btn"
                style="font-weight:bold;">

        </form>

    </article>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Silver Oak University | All Rights Reserved</p>
    </footer>

</body>

</html>
