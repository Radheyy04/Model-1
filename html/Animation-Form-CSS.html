<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Student Form</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #1e3c72, #2a5298);
        }

        /* Slide Animation */
        @keyframes slideIn {
            from {
                transform: translateY(-80px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .form-box {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            animation: slideIn 1s ease;
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e3c72;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            outline: none;
        }

        .gender {
            width: auto;
            margin-right: 5px;
        }

        .btn {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn {
            background: #16a34a;
        }

        .reset-btn {
            background: #dc2626;
            float: right;
        }

    </style>

</head>

<body>

    <div class="form-box">

        <h2>Student Registration Form</h2>

        <form>

            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Enrollment No</label>
            <input type="text" placeholder="Enter enrollment number">

            <label>Branch</label>
            <select>
                <option>Select Branch</option>
                <option>Computer Engineering</option>
                <option>Information Technology</option>
                <option>Mechanical Engineering</option>
            </select>

            <label>Gender</label><br><br>

            <input type="radio" name="gender" class="gender"> Male

            <input type="radio" name="gender"
                class="gender"
                style="margin-left:20px;"> Female

            <br><br>

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Remarks</label>
            <textarea rows="3"
                placeholder="Enter remarks"></textarea>

            <input type="submit"
                value="Submit"
                class="btn submit-btn">

            <input type="reset"
                value="Clear"
                class="btn reset-btn">

        </form>

    </div>

</body>

</html>
