<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iframe Example</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            width: 850px;
            margin: auto;
            padding: 20px;
            border-radius: 12px;
        }

        iframe {
            margin-top: 20px;
            border-radius: 10px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Iframe Example</h1>

        <!-- YouTube Video -->
        <h2>YouTube Video</h2>

        <iframe width="1071" height="600" src="https://www.youtube.com/embed/zjFI0Yd5700" title="Silver Oak University Campus" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <br><br>

        <!-- Google Map -->
        <h2>Google Map</h2>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3671.8705845802233!2d72.5300385!3d23.028523500000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e84c92801abe1%3A0x1e87b88447826d9e!2sITC%20Narmada%2C%20a%20Luxury%20Collection%20Hotel%2C%20Ahmedabad!5e0!3m2!1sen!2sin!4v1778575816484!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

    </div>

</body>

</html>
